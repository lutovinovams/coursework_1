[project]
name = "coursework-1"
version = "0.1.0"
description = ""
authors = [
    {name = "lutovinova_mariya",email = "bukovka09@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "xlrd (>=2.0.2,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
lint = [
    'flake8 (>=7.3.0,<8.0.0)',
    'black (>=26.3.1,<27.0.0)',

   'mypy (>=1.19.1,<2.0.0)',

    'isort (>=8.0.1,<9.0.0)']
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]

    [tool.isort ]
    line_length = 119


    [tool.black]
line_length = 119
exclude = '''
(
  /(\.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
)
'''

    [tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'